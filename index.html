<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Mekanisme Kontraksi Otot Rangka</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif}
#info{position:fixed;z-index:5;top:10px;left:10px;right:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.94);font-size:14px;line-height:1.35;color:#172033}
</style>
</head>
<body>
<div id="info"><b>AR Mekanisme Kontraksi Otot Rangka</b><br>Arahkan kamera ke gambar marker. Merah = aktin; biru = miosin. Ini model skematis.</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes;"
 color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
 vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
 <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
 <a-entity mindar-image-target="targetIndex: 0">
  <a-plane position="0 0.62 0" width="1.05" height="0.18" color="#ffffff" opacity="0.95"></a-plane>
  <a-text value="KONTRAKSI OTOT RANGKA" position="0 0.60 0.02" align="center" color="#17365d" width="1.3"></a-text>
  <!-- garis Z -->
  <a-box position="-0.48 0 0.03" width="0.035" height="0.62" depth="0.05" color="#7e57c2"></a-box>
  <a-box position="0.48 0 0.03" width="0.035" height="0.62" depth="0.05" color="#7e57c2"></a-box>
  <!-- aktin kiri dan kanan -->
  <a-entity id="actinLeft" animation="property: position; to: 0.10 0 0; dur: 1800; dir: alternate; loop: true; easing: easeInOutSine">
   <a-cylinder position="-0.29 0.20 0.08" rotation="0 0 90" radius="0.024" height="0.32" color="#e53935"></a-cylinder>
   <a-cylinder position="-0.29 0.10 0.08" rotation="0 0 90" radius="0.024" height="0.32" color="#ef5350"></a-cylinder>
   <a-cylinder position="-0.29 0.00 0.08" rotation="0 0 90" radius="0.024" height="0.32" color="#e53935"></a-cylinder>
   <a-cylinder position="-0.29 -0.10 0.08" rotation="0 0 90" radius="0.024" height="0.32" color="#ef5350"></a-cylinder>
  </a-entity>
  <a-entity id="actinRight" animation="property: position; to: -0.10 0 0; dur: 1800; dir: alternate; loop: true; easing: easeInOutSine">
   <a-cylinder position="0.29 0.20 0.08" rotation="0 0 90" radius="0.024" height="0.32" color="#e53935"></a-cylinder>
   <a-cylinder position="0.29 0.10 0.08" rotation="0 0 90" radius="0.024" height="0.32" color="#ef5350"></a-cylinder>
   <a-cylinder position="0.29 0.00 0.08" rotation="0 0 90" radius="0.024" height="0.32" color="#e53935"></a-cylinder>
   <a-cylinder position="0.29 -0.10 0.08" rotation="0 0 90" radius="0.024" height="0.32" color="#ef5350"></a-cylinder>
  </a-entity>
  <!-- miosin tengah -->
  <a-cylinder position="0 0.06 0.13" rotation="0 0 90" radius="0.035" height="0.42" color="#1565c0"></a-cylinder>
  <a-cylinder position="0 -0.05 0.13" rotation="0 0 90" radius="0.035" height="0.42" color="#1976d2"></a-cylinder>
  <a-sphere position="-0.16 0.14 0.16" radius="0.04" color="#42a5f5"></a-sphere>
  <a-sphere position="-0.05 0.14 0.16" radius="0.04" color="#42a5f5"></a-sphere>
  <a-sphere position="0.05 0.14 0.16" radius="0.04" color="#42a5f5"></a-sphere>
  <a-sphere position="0.16 0.14 0.16" radius="0.04" color="#42a5f5"></a-sphere>
  <a-sphere position="-0.16 -0.12 0.16" radius="0.04" color="#42a5f5"></a-sphere>
  <a-sphere position="-0.05 -0.12 0.16" radius="0.04" color="#42a5f5"></a-sphere>
  <a-sphere position="0.05 -0.12 0.16" radius="0.04" color="#42a5f5"></a-sphere>
  <a-sphere position="0.16 -0.12 0.16" radius="0.04" color="#42a5f5"></a-sphere>
  <a-plane position="0 -0.44 0" width="1.04" height="0.22" color="#ffffff" opacity="0.96"></a-plane>
  <a-text value="Aktin bergeser melewati miosin; sarkomer memendek." position="0 -0.42 0.03" align="center" color="#172033" width="1.0" wrap-count="34"></a-text>
 </a-entity>
</a-scene>
</body>
</html>
